name: CI

# `npm run release:check`（typecheck → lint → 依存監査 → DBテスト → build → E2E）を
# push / PR ごとに機械的に実行する。ゲートが整っていても「手元で実行し忘れる」限り
# 意味が無いため、実行そのものを強制するのがこのワークフローの目的。
#
# 秘密情報は使わない。テストは外部API（Stripe / X / AI各社 / SMTP）をモックし、実データは
# `supabase start` で立ち上げるローカルSupabaseだけを使う。env は scripts/ci-env.mjs が組む。

on:
  push:
    branches: [main, stg]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Cloudflare が公開しているTurnstileのテストsecret（常に成功）。秘密情報ではない。
  # supabase/config.toml の [auth.captcha] が env() で参照するため start 前に必要。
  # scripts/ci-env.mjs も同じ値を .env.local へ書く（変えるなら両方）。
  TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
  # config.toml が Studio 用に参照するだけのダミー（AI機能は使わない）。
  OPENAI_API_KEY: ci-placeholder

jobs:
  # 数十秒で落ちる検査を先に回し、重い verify を待たずに失敗を返す。
  # verify 側でも release:check の一部として再実行されるので、ここを消しても穴は開かない。
  static:
    name: 型・lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # **stg→main のPRでは走らせない**（T-M8-376）。同じコミットのpush時runが既に検査しており、
    # 必須チェックはコミット単位で判定されるためpush時の結果がPRにも効く。skippedは必須チェック上
    # 成功扱い。1リリースで同一内容のフルCIを3回（stg push→PR→main push・計約40分）回していた。
    if: github.event_name != 'pull_request' || github.head_ref != 'stg'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # ローカル開発と同じメジャーに揃える（差があると型・build結果がずれる）。
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  verify:
    name: release:check（DB・build・E2E）
    runs-on: ubuntu-latest
    # supabase のイメージ取得と Playwright を含むため長め。
    timeout-minutes: 40
    # static と同じ理由（stg→main のPRはpush時runが検査済み・T-M8-376）。
    if: github.event_name != 'pull_request' || github.head_ref != 'stg'
    steps:
      - uses: actions/checkout@v4
        with:
          # **全履歴を取る。** `check:doc-dates` は「その文書を最後に変えたコミットの日付」を
          # git履歴から読むため、既定の浅いclone（depth 1）だと**全文書が「今日変わった」ように
          # 見えて誤検知する**（2026-08-18、手元は緑なのにCIだけが落ちた）。
          # 検査側も浅いcloneを検出して止めるので、ここを消せば赤くなって気付ける。
          fetch-depth: 0

      - name: 同一内容の緑を探す（マージ元で検証済みなら以降をスキップ）
        # **mainへのマージコミットは中身がstg headと同一**（stgはmainから分岐せず常に先行）。
        # 同じtreeを再検証しても結果は変わらないので、マージ元コミットに成功済みの
        # 「release:check」check runがあればスキップする（T-M8-376）。
        # treeが一致しない（真に新しい内容の）pushは従来どおりフルで走る。
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          skip=false
          if git rev-parse -q --verify HEAD^2 >/dev/null 2>&1; then
            if [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'HEAD^2^{tree}')" ]; then
              src=$(git rev-parse HEAD^2)
              if git log -1 --format=%B "$src" | grep -Eiq "\[(skip ci|ci skip|no ci|skip actions|actions skip)\]"; then
                echo "マージ元 ${src} は運営者が [skip ci] を指定したコミット（些細な修正）。以降をスキップします。"
                skip=true
              fi
              greens=$(gh api "repos/${{ github.repository }}/commits/${src}/check-runs" \
                --jq '[.check_runs[] | select(.name == "release:check（DB・build・E2E）" and .conclusion == "success")] | length')
              if [ "${greens}" -ge 1 ]; then
                echo "マージ元 ${src} が同一treeで検証済み。以降をスキップします。"
                skip=true
              fi
            fi
          fi
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"

      - if: steps.reuse.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
      - if: steps.reuse.outputs.skip != 'true'
        run: npm ci

      - if: steps.reuse.outputs.skip != 'true'
        uses: supabase/setup-cli@v1
        with:
          # ローカルと同じCLIを使う（migration適用の挙動差を避ける）。
          version: 2.109.1

      - name: ローカルSupabaseを起動（migration＋seedを適用）
        if: steps.reuse.outputs.skip != 'true'
        run: supabase start

      - name: CI用の .env.local を生成
        if: steps.reuse.outputs.skip != 'true'
        run: |
          set -euo pipefail
          # 出力には local 用のANON/SERVICE_ROLEキーが含まれるのでログへ出さずファイルへ。
          supabase status -o env > "$RUNNER_TEMP/supabase-status.env"
          SUPABASE_STATUS_ENV="$RUNNER_TEMP/supabase-status.env" node scripts/ci-env.mjs > .env.local
          echo "生成キー数: $(grep -cE '^[A-Z_0-9]+=' .env.local)"

      - name: service_role の権限が適用されているか（migration 20260726000002 の確認）
        # 2026-07-26 のX連携不具合の原因。ここが落ちたら以降のテストは全滞するので先に見る。
        if: steps.reuse.outputs.skip != 'true'
        run: |
          set -euo pipefail
          npx vitest run src/lib/db/service-role-grants.db.test.ts

      - name: Playwright のブラウザを取得
        if: steps.reuse.outputs.skip != 'true'
        run: npx playwright install --with-deps chromium

      - name: release:check
        # 手元で実行するゲートと同一コマンド。CI側で手順を書き写すと release:check への
        # 追加がCIに反映されず穴が開くため、分解せずそのまま呼ぶ。
        if: steps.reuse.outputs.skip != 'true'
        run: npm run release:check

      - name: 失敗時の証跡を保存
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          # html reporter は未設定のため playwright-report/ は生成されない（trace/screenshot は test-results/）。
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
