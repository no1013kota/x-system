<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1090" viewBox="0 0 1200 1090">
  <rect width="1200" height="1090" fill="#ffffff"/>
  <g font-family="Hiragino Sans, Noto Sans JP, sans-serif" fill="#1f1a1e">
    <text x="600" y="64" text-anchor="middle" font-size="44" font-weight="700" fill="#7d1f75">採点は「件数」ではなく「確率」に重みを掛ける</text>
    <text x="600" y="112" text-anchor="middle" font-size="40" fill="#5a4f58">合計点 ＝ Σ（重み × その読者がその行動をとる確率）</text>

    <!-- top: misconception -->
    <rect x="40" y="150" width="1120" height="290" rx="18" fill="#ffffff" stroke="#b5a9b3" stroke-width="3" stroke-dasharray="12 8"/>
    <text x="600" y="205" text-anchor="middle" font-size="40" font-weight="700" fill="#5a4f58">よくある誤解：付いた「件数」に重みを掛ける</text>
    <rect x="200" y="235" width="800" height="130" rx="14" fill="#f5f2f4"/>
    <text x="600" y="315" text-anchor="middle" font-size="40" fill="#5a4f58">いいね 100件 × 0.5 ＝ +50点？</text>
    <line x1="230" y1="250" x2="970" y2="350" stroke="#b5a9b3" stroke-width="7" stroke-opacity="0.5" stroke-linecap="round"/>
    <line x1="970" y1="250" x2="230" y2="350" stroke="#b5a9b3" stroke-width="7" stroke-opacity="0.5" stroke-linecap="round"/>
    <text x="600" y="415" text-anchor="middle" font-size="40" fill="#5a4f58">説明書が2026-08-14に否定した読み方</text>

    <!-- bottom: actual -->
    <rect x="40" y="480" width="1120" height="520" rx="18" fill="#f4e8f3" stroke="#7d1f75" stroke-width="3"/>
    <text x="600" y="535" text-anchor="middle" font-size="40" font-weight="700" fill="#7d1f75">公開コードの式：読者ごとの「確率」に掛ける</text>

    <rect x="80" y="565" width="1040" height="290" rx="14" fill="#ffffff"/>
    <text x="120" y="620" font-size="40">いいねする確率</text>
    <text x="1080" y="620" text-anchor="end" font-size="40">0.3 × 0.5 ＝ +0.15</text>
    <text x="120" y="675" font-size="40">返信する確率</text>
    <text x="1080" y="675" text-anchor="end" font-size="40">0.1 × 5.0 ＝ +0.50</text>
    <text x="120" y="730" font-size="40" font-weight="700" fill="#7d1f75">報告する確率</text>
    <text x="1080" y="730" text-anchor="end" font-size="40" font-weight="700" fill="#7d1f75">0.003 × (-234) ＝ -0.70</text>
    <line x1="120" y1="758" x2="1080" y2="758" stroke="#7d1f75" stroke-width="3"/>
    <text x="120" y="815" font-size="40" font-weight="700" fill="#7d1f75">合計</text>
    <text x="1080" y="815" text-anchor="end" font-size="44" font-weight="700" fill="#7d1f75">-0.05</text>

    <text x="600" y="905" text-anchor="middle" font-size="40">報告される見込みが 0.3% あるだけで、</text>
    <text x="600" y="950" text-anchor="middle" font-size="40">いいね・返信の見込みを合わせても打ち消される</text>

    <text x="600" y="1052" text-anchor="middle" font-size="40" fill="#5a4f58">重みは param.rs（2026-09-02時点）。確率は仮の値</text>
  </g>
</svg>
