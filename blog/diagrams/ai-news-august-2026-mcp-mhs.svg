<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960">
  <rect width="1200" height="960" fill="#ffffff"/>
  <g font-family="Hiragino Sans, Noto Sans JP, sans-serif">
  <text x="60" y="93" font-size="54" font-weight="700" fill="#7d1f75">AIと「道具」をつなぐ2つの規格</text>

  <!-- agent -->
  <rect x="210" y="138" width="780" height="102" rx="21" fill="#7d1f75"/>
  <text x="600" y="207" text-anchor="middle" font-size="48" font-weight="700" fill="#ffffff">AIエージェント（Claudeなど）</text>

  <!-- connectors agent -> hubs -->
  <line x1="450" y1="240" x2="309" y2="309" stroke="#7d1f75" stroke-width="4.5"/>
  <line x1="750" y1="240" x2="891" y2="309" stroke="#7d1f75" stroke-width="4.5"/>

  <!-- MCP hub -->
  <rect x="36" y="309" width="546" height="495" rx="21" fill="#f4e8f3" stroke="#7d1f75" stroke-width="3"/>
  <text x="309" y="384" text-anchor="middle" font-size="54" font-weight="700" fill="#7d1f75">MCP</text>
  <text x="309" y="444" text-anchor="middle" font-size="42" font-weight="700" fill="#7d1f75">ソフトウェア向け</text>
  <text x="309" y="510" text-anchor="middle" font-size="42" fill="#1f1a1e">AIとアプリをつなぐ</text>
  <rect x="60" y="540" width="498" height="144" rx="18" fill="#ffffff" stroke="#7d1f75" stroke-width="2.25"/>
  <text x="309" y="597" text-anchor="middle" font-size="42" fill="#1f1a1e">Web API・ファイル</text>
  <text x="309" y="660" text-anchor="middle" font-size="42" fill="#1f1a1e">ブラウザ・アプリ</text>
  <text x="309" y="756" text-anchor="middle" font-size="42" font-weight="700" fill="#7d1f75">すでに事実上の標準</text>

  <!-- MHS hub -->
  <rect x="618" y="309" width="546" height="495" rx="21" fill="#f4e8f3" stroke="#7d1f75" stroke-width="3"/>
  <text x="891" y="384" text-anchor="middle" font-size="54" font-weight="700" fill="#7d1f75">MHS</text>
  <text x="891" y="444" text-anchor="middle" font-size="42" font-weight="700" fill="#7d1f75">物理機器向け</text>
  <text x="891" y="510" text-anchor="middle" font-size="42" fill="#1f1a1e">AIと実験機器をつなぐ</text>
  <rect x="642" y="540" width="498" height="144" rx="18" fill="#ffffff" stroke="#7d1f75" stroke-width="2.25"/>
  <text x="891" y="597" text-anchor="middle" font-size="42" fill="#1f1a1e">顕微鏡・分注機</text>
  <text x="891" y="660" text-anchor="middle" font-size="42" fill="#1f1a1e">ロボットアーム</text>
  <text x="891" y="756" text-anchor="middle" font-size="42" font-weight="700" fill="#7d1f75">8月27日 研究プレビュー</text>

  <!-- caption -->
  <text x="600" y="894" text-anchor="middle" font-size="42" fill="#1f1a1e">つなぐ相手が違うだけで、役割は同じ共通規格</text>
  </g>
</svg>
