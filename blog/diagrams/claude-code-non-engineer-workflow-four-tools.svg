<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1330" viewBox="0 0 1200 1330" font-family="Hiragino Sans, Noto Sans JP, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#7d1f75"/>
    </marker>
  </defs>
  <rect width="1200" height="1330" fill="#ffffff"/>

  <!-- あなた -->
  <rect x="60" y="40" width="1080" height="130" rx="20" fill="#ffffff" stroke="#7d1f75" stroke-width="4"/>
  <text x="600" y="121" font-size="48" font-weight="bold" fill="#7d1f75" text-anchor="middle">あなた</text>

  <!-- あなた ⇄ Claude Code -->
  <line x1="380" y1="172" x2="380" y2="292" stroke="#7d1f75" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="404" y="245" font-size="40" fill="#1f1a1e">日本語で頼む</text>
  <line x1="790" y1="298" x2="790" y2="178" stroke="#7d1f75" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="814" y="245" font-size="40" fill="#1f1a1e">報告と画面を見る</text>

  <!-- Claude Code -->
  <rect x="60" y="300" width="1080" height="150" rx="20" fill="#7d1f75"/>
  <text x="600" y="368" font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle">Claude Code</text>
  <text x="600" y="422" font-size="40" fill="#ffffff" text-anchor="middle">4つのファイルを読んで作り、報告する</text>

  <!-- Claude → フォルダ -->
  <line x1="600" y1="452" x2="600" y2="522" stroke="#7d1f75" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- プロジェクトのフォルダ -->
  <rect x="60" y="530" width="1080" height="770" rx="24" fill="#ffffff" stroke="#7d1f75" stroke-width="3" stroke-dasharray="14 10"/>
  <text x="600" y="592" font-size="40" font-weight="bold" fill="#7d1f75" text-anchor="middle">あなたのプロジェクトのフォルダ（文字だけのファイル4つ）</text>

  <!-- 1 CLAUDE.md -->
  <rect x="100" y="630" width="1000" height="150" rx="18" fill="#f4e8f3" stroke="#7d1f75" stroke-width="3"/>
  <text x="130" y="688" font-size="44" font-weight="bold" fill="#1f1a1e">CLAUDE.md（約束）</text>
  <rect x="130" y="708" width="360" height="60" rx="27" fill="#ffffff" stroke="#7d1f75" stroke-width="2"/>
  <text x="310" y="746" font-size="40" fill="#7d1f75" text-anchor="middle">毎回自動で読む</text>

  <!-- 2 skills -->
  <rect x="100" y="800" width="1000" height="150" rx="18" fill="#f4e8f3" stroke="#7d1f75" stroke-width="3"/>
  <text x="130" y="858" font-size="44" font-weight="bold" fill="#1f1a1e">手順書（skills）</text>
  <rect x="130" y="878" width="380" height="60" rx="27" fill="#ffffff" stroke="#7d1f75" stroke-width="2"/>
  <text x="320" y="916" font-size="40" fill="#7d1f75" text-anchor="middle">呼んだときに読む</text>

  <!-- 3 docs -->
  <rect x="100" y="970" width="1000" height="150" rx="18" fill="#f4e8f3" stroke="#7d1f75" stroke-width="3"/>
  <text x="130" y="1028" font-size="44" font-weight="bold" fill="#1f1a1e">docs/（仕様書）</text>
  <rect x="130" y="1048" width="360" height="60" rx="27" fill="#ffffff" stroke="#7d1f75" stroke-width="2"/>
  <text x="310" y="1086" font-size="40" fill="#7d1f75" text-anchor="middle">変えたら直す</text>

  <!-- 4 BACKLOG -->
  <rect x="100" y="1140" width="1000" height="150" rx="18" fill="#f4e8f3" stroke="#7d1f75" stroke-width="3"/>
  <text x="130" y="1198" font-size="44" font-weight="bold" fill="#1f1a1e">tasks/BACKLOG.md（作業キュー）</text>
  <rect x="130" y="1218" width="360" height="60" rx="27" fill="#ffffff" stroke="#7d1f75" stroke-width="2"/>
  <text x="310" y="1256" font-size="40" fill="#7d1f75" text-anchor="middle">上から1件ずつ</text>
</svg>
