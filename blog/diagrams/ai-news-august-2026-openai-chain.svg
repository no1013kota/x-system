<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1215" viewBox="0 0 1200 1215">
  <rect width="1200" height="1215" fill="#ffffff"/>
  <g font-family="Hiragino Sans, Noto Sans JP, sans-serif">
  <text x="60" y="93" font-size="54" font-weight="700" fill="#7d1f75">OpenAIの8月：3つの発表は一直線</text>

  <!-- box 1 -->
  <rect x="60" y="150" width="1080" height="180" rx="21" fill="#f4e8f3" stroke="#7d1f75" stroke-width="3"/>
  <text x="108" y="261" font-size="51" font-weight="700" fill="#7d1f75">配る</text>
  <text x="450" y="225" font-size="45" fill="#1f1a1e">8月6日 無料でも無制限化</text>
  <text x="450" y="294" font-size="42" fill="#1f1a1e">週間利用者は約10億人</text>

  <line x1="600" y1="330" x2="600" y2="381" stroke="#7d1f75" stroke-width="6" stroke-linecap="round"/>
  <polygon points="576,381 624,381 600,408" fill="#7d1f75"/>

  <!-- box 2 -->
  <rect x="60" y="408" width="1080" height="180" rx="21" fill="#f4e8f3" stroke="#7d1f75" stroke-width="3"/>
  <text x="108" y="519" font-size="51" font-weight="700" fill="#7d1f75">対象を広げる</text>
  <text x="450" y="483" font-size="45" fill="#1f1a1e">8月18日 10代向け版</text>
  <text x="450" y="552" font-size="42" fill="#1f1a1e">ChatGPT for Teens</text>

  <line x1="600" y1="588" x2="600" y2="639" stroke="#7d1f75" stroke-width="6" stroke-linecap="round"/>
  <polygon points="576,639 624,639 600,666" fill="#7d1f75"/>

  <!-- box 3 -->
  <rect x="60" y="666" width="1080" height="180" rx="21" fill="#f4e8f3" stroke="#7d1f75" stroke-width="3"/>
  <text x="108" y="777" font-size="51" font-weight="700" fill="#7d1f75">原価を下げる</text>
  <text x="450" y="741" font-size="45" fill="#1f1a1e">8月25日 自社推論チップ</text>
  <text x="450" y="810" font-size="42" fill="#1f1a1e">Jalapeño、外販はしない</text>

  <!-- separator + caption -->
  <line x1="60" y1="900" x2="1140" y2="900" stroke="#7d1f75" stroke-width="3" stroke-dasharray="12 12"/>
  <text x="600" y="972" text-anchor="middle" font-size="45" font-weight="700" fill="#1f1a1e">賢さの差ではなく、原価と配布網で勝つ構え</text>

  <!-- Astra -->
  <rect x="60" y="1026" width="1080" height="162" rx="21" fill="#ffffff" stroke="#7d1f75" stroke-width="3" stroke-dasharray="15 12"/>
  <text x="600" y="1092" text-anchor="middle" font-size="45" font-weight="700" fill="#7d1f75">8月1日 Astra：数学の未解決問題10問を証明</text>
  <text x="600" y="1158" text-anchor="middle" font-size="42" fill="#1f1a1e">研究面の旗。未公開モデルで第三者はまだ試せない</text>
  </g>
</svg>
