<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1470" viewBox="0 0 1200 1470">
  <rect width="1200" height="1470" fill="#ffffff"/>
  <g font-family="Hiragino Sans, Noto Sans JP, sans-serif">
  <text x="60" y="93" font-size="54" font-weight="700" fill="#7d1f75">2026年8月の主な出来事</text>
  <line x1="96" y1="210" x2="96" y2="1290" stroke="#7d1f75" stroke-width="6" stroke-linecap="round"/>

  <!-- 8/2 -->
  <circle cx="96" cy="231" r="16.5" fill="#7d1f75" stroke="#ffffff" stroke-width="4.5"/>
  <text x="150" y="246" font-size="51" font-weight="700" fill="#7d1f75">8月2日</text>
  <text x="150" y="318" font-size="46" fill="#1f1a1e">EUのAI規制法が罰則付きで執行開始</text>
  <text x="150" y="378" font-size="46" fill="#1f1a1e">違反は最大1,500万ユーロの制裁金</text>

  <!-- 8/6 -->
  <circle cx="96" cy="441" r="16.5" fill="#7d1f75" stroke="#ffffff" stroke-width="4.5"/>
  <text x="150" y="456" font-size="51" font-weight="700" fill="#7d1f75">8月6日</text>
  <text x="150" y="528" font-size="46" fill="#1f1a1e">ChatGPTの無料版もチャット無制限に</text>
  <text x="150" y="588" font-size="46" fill="#1f1a1e">週間利用者は約10億人（報道）</text>

  <!-- 8/20 -->
  <circle cx="96" cy="651" r="16.5" fill="#7d1f75" stroke="#ffffff" stroke-width="4.5"/>
  <text x="150" y="666" font-size="51" font-weight="700" fill="#7d1f75">8月20日</text>
  <text x="150" y="738" font-size="46" fill="#1f1a1e">ClaudeのPC操作・ブラウザ操作を</text>
  <text x="150" y="798" font-size="46" fill="#1f1a1e">開発者向けに正式提供</text>

  <!-- 8/26 -->
  <circle cx="96" cy="861" r="16.5" fill="#7d1f75" stroke="#ffffff" stroke-width="4.5"/>
  <text x="150" y="876" font-size="51" font-weight="700" fill="#7d1f75">8月26日</text>
  <text x="150" y="948" font-size="46" fill="#1f1a1e">NVIDIA決算、売上962億ドル</text>
  <text x="150" y="1008" font-size="46" fill="#1f1a1e">前年比+106%、粗利率75%</text>

  <!-- 8/27 -->
  <circle cx="96" cy="1071" r="16.5" fill="#7d1f75" stroke="#ffffff" stroke-width="4.5"/>
  <text x="150" y="1086" font-size="51" font-weight="700" fill="#7d1f75">8月27日</text>
  <text x="150" y="1158" font-size="46" fill="#1f1a1e">顕微鏡やロボットアームをAIが動かす</text>
  <text x="150" y="1218" font-size="46" fill="#1f1a1e">共通規格MHSを研究者向けに公開</text>

  <!-- 8/29 -->
  <circle cx="96" cy="1281" r="16.5" fill="#7d1f75" stroke="#ffffff" stroke-width="4.5"/>
  <text x="150" y="1296" font-size="51" font-weight="700" fill="#7d1f75">8月29日</text>
  <text x="150" y="1368" font-size="46" fill="#1f1a1e">EUがOpenAIなど大手AI企業へ</text>
  <text x="150" y="1428" font-size="46" fill="#1f1a1e">安全性などの情報を正式に要求（報道）</text>
  </g>
</svg>
